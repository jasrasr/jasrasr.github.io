<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Links</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
        }

        /* ===== Link Grid ===== */
        .links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: minmax(140px, auto);
            gap: 0;
            overflow-y: auto;
            min-height: 0;
        }

        .link-area {
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            padding: 20px;
            min-height: 140px;
            transition: transform 0.1s ease, opacity 0.1s ease;
        }

        .link-area:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* Color palette (repeats safely if you add more links) */
        .link-area:nth-child(6n+1) { background-color: #007BFF; }
        .link-area:nth-child(6n+2) { background-color: #28A745; }
        .link-area:nth-child(6n+3) { background-color: #FFC107; color: #222; }
        .link-area:nth-child(6n+4) { background-color: #DC3545; }
        .link-area:nth-child(6n+5) { background-color: #6F42C1; }
        .link-area:nth-child(6n+6) { background-color: #20C997; }

        /* ===== Footer ===== */
        footer {
            text-align: center;
            padding: 8px;
            font-size: 0.85rem;
            color: #666;
            background: #f4f4f4;
            border-top: 1px solid #ddd;
        }

        /* Tablet: 2 columns */
        @media (max-width: 900px) {
            .links {
                grid-template-columns: repeat(2, 1fr);
            }
            .link-area {
                font-size: 1.6rem;
                min-height: 130px;
            }
        }

        /* Mobile: 2 columns x 4 rows, fitted to the visible viewport */
        @media (max-width: 600px) {
            html,
            body {
                height: 100%;
            }

            body {
                height: 100vh;
                height: 100dvh;
                min-height: 100vh;
                min-height: 100dvh;
                overflow: hidden;
            }

            .links {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(4, minmax(44px, 1fr));
                grid-auto-rows: minmax(44px, 1fr);
                overflow-y: auto;
                min-height: 0;
            }

            .link-area {
                font-size: clamp(1rem, 4.5vw, 1.55rem);
                min-height: 0;
                padding: 8px 10px;
                overflow-wrap: anywhere;
            }

            footer {
                padding: 5px 8px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>

<body>

    <!-- ===== LINKS ===== -->
    <div class="links">
        <a href="https://jasr.me/github/mpg/" class="link-area">MPG</a>
        <a href="https://jasr.me/fs/" class="link-area">TICKETS</a>
        <a href="https://jasr.me/cvc/" class="link-area">CVC</a>
        <a href="https://jasr.me/family-tracker" class="link-area">FAMILY-TRACKER</a>
        <a href="https://jasr.me/weather/" class="link-area">WEATHER</a>
        <a href="https://jasr.me/license-plate" class="link-area">LICENSE-PLATE</a>
        <a href="https://jasr.me/box/" class="link-area">BOX</a>
        <a href="https://jasr.me/updates/" class="link-area">UPDATES</a>

        <!-- Just keep adding more -->
    </div>

    <!-- ===== FOOTER ===== -->
    <footer id="footer"></footer>

    <script>
        /*
            Centralized metadata
            Change revision ONCE here
        */
        const fileName = 'links.html';
        const revision = '1.6';
        const year = new Date().getFullYear();
        const modified = new Date().toLocaleDateString();

        document.getElementById('footer').textContent =
            `${fileName} | Rev ${revision}`;
            // | © ${year} | Modified ${modified}
    </script>

</body>
</html>
